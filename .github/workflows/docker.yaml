name: Docker

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"

jobs:

  build:
    name: Pull
    runs-on: ubuntu-latest
    steps:
    - name: Before freeing up disk space
      run: |
        echo "Before freeing up disk space"
        echo "=============================================================================="
        df -hT
        echo "=============================================================================="

    - name: Maximize build space
      uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: 2048
        swap-size-mb: 128
        remove-dotnet: 'true'
        remove-haskell: 'true'
        build-mount-path: '/var/lib/docker/'

    - name: Restart docker
      run: sudo service docker restart

    - name: Free up disk space complete
      run: |
        echo "Free up disk space complete"
        echo "=============================================================================="
        df -hT
        echo "=============================================================================="

    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Docker Setup Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push image Aliyun
      run: |
        docker login -u "$ALIYUN_REGISTRY_USER" -p "$ALIYUN_REGISTRY_PASSWORD" "$ALIYUN_REGISTRY"

        while IFS= read -r line || [ -n "$line" ]; do
            [[ -z "$line" ]] && continue
            if echo "$line" | grep -q '^\s*#'; then
                continue
            fi

            # 提取 --platform
            platform=$(echo "$line" | awk -F'--platform[ =]' '{if (NF>1) print $2}' | awk '{print $1}')
            rest=$(echo "$line" | sed -E 's/--platform[ =][^ ]+//g' | xargs)

            # 解析自定义命名
            if echo "$rest" | grep -q '=>'; then
                src_image=$(echo "$rest" | awk -F'=>' '{print $1}' | xargs)
                custom_name=$(echo "$rest" | awk -F'=>' '{print $2}' | xargs)
            else
                src_image="$rest"
                custom_name=""
            fi

            # 平台前缀
            if [ -z "$platform" ]; then
                platform_prefix=""
                inspect_platform="linux/amd64"   # 默认平台，用于获取 digest
            else
                platform_prefix="${platform//\//_}_"
                inspect_platform="$platform"
            fi

            # 提取命名空间和镜像名:标签
            image_name_tag=$(echo "$src_image" | awk -F'/' '{print $NF}')
            name_space=$(echo "$src_image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
            image_name_tag="${image_name_tag%%@*}"

            # 目标镜像名
            if [ -n "$custom_name" ]; then
                target_image_name_tag="$custom_name"
            else
                name_space_prefix=""
                if [ -n "${name_space}" ]; then
                    name_space_prefix="${name_space}_"
                fi
                target_image_name_tag="${name_space_prefix}${image_name_tag}"
            fi

            new_image="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/$platform_prefix$target_image_name_tag"
            echo "src_image  = $src_image"
            echo "new_image  = $new_image"
            echo "platform   = $inspect_platform"

            # ========== 推送前比对 digest，避免重复拉取和推送 ==========
            echo "获取源镜像 config digest..."
            src_digest=$(docker buildx imagetools inspect \
                --platform "$inspect_platform" \
                "$src_image" \
                --format '{{.Image.Digest}}' 2>/dev/null)
            echo "src_digest = $src_digest"

            echo "获取阿里云远端 config digest..."
            remote_digest=$(docker buildx imagetools inspect \
                "$new_image" \
                --format '{{.Image.Digest}}' 2>/dev/null)
            echo "remote_digest = $remote_digest"

            if [ -n "$src_digest" ] && [ -n "$remote_digest" ] && [ "$src_digest" = "$remote_digest" ]; then
                echo "=========================================================="
                echo "镜像 $new_image 内容未变化，跳过拉取与推送"
                echo "=========================================================="
                continue
            fi
            # ==========================================================

            echo "docker pull $src_image"
            docker pull "$src_image"

            echo "docker tag $src_image $new_image"
            docker tag "$src_image" "$new_image"

            echo "docker push $new_image"
            docker push "$new_image"

            echo "开始清理磁盘空间"
            echo "=============================================================================="
            df -hT
            echo "=============================================================================="
            docker rmi "$src_image" 2>/dev/null || true
            docker rmi "$new_image" 2>/dev/null || true
            echo "磁盘空间清理完毕"
            echo "=============================================================================="
            df -hT
            echo "=============================================================================="

        done < images.txt
